[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bip2026"
version = "0.1.0"
description = "Cross-Modal Representation Disagreement as a Lightweight Uncertainty Signal for Glaucoma Detection in Medical Vision-Language Models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "BIP 2026 Team"}
]
keywords = ["vision-language-models", "uncertainty-quantification", "glaucoma", "medgemma"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.51.3",
    "accelerate>=0.25.0",
    "huggingface_hub>=0.20.0",
    "datasets>=5.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "PyYAML>=6.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.7.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
quant = ["bitsandbytes>=0.43.0 ; platform_system != 'Windows'"]
delong = ["rocauc-comparison>=0.1.0"]
dev = ["pytest>=7.0", "black", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["E501"]
